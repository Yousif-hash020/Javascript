<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Card</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1f2937,#111827);
}

.card{
    width:350px;
    padding:25px;
    border-radius:20px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    text-align:center;
    color:white;
}

.card h2{
    margin-bottom:25px;
}

.progress{
    width:100%;
    height:14px;
    background:rgba(255,255,255,.15);
    border-radius:20px;
    overflow:hidden;
}

.fill{
    width:0%;
    height:100%;
    background:#00ff9d;
    border-radius:20px;
    transition:0.2s;
}

#percent{
    margin:20px 0;
    font-size:28px;
}


</style>

</head>
<body>

<div class="card">

    <h2 id="title">Downloading File</h2>

    <div class="progress">
        <div class="fill"></div>
    </div>

    <h1 id="percent">0%</h1>

</div>
<script src="Downloadbar.js"></script>

</body>
</html>
