<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input{
            display: block;
            padding: 4px;
            border-radius: 20px;
            margin: 10px;
            outline: none;
        }

        button{
            padding: 5px;
            border-radius: 10px;
            width: 100px;
        }

    </style>
</head>

<body style="background-color: black; color: white; margin: 0; padding: 0; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    <form id="userForm" style="display: flex; flex-direction: column; justify-content: center; align-items: center; background-color:#437990; margin: 20px; border-radius: 20px; padding: 20px;">

    <input type="text" id="name" placeholder="Name">

    <input type="email" id="email" placeholder="Email">

    <input type="number" id="age" placeholder="Age">

    <button type="submit">Submit</button>

</form>
<script src="post.js"></script>
</body>
</html>
