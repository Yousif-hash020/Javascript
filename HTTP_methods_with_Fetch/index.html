<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: #f5f5f5;
            min-height: 100vh;
        }


        /* Main */

        .app {
            width: 90%;
            max-width: 900px;
            margin: 50px auto;
        }


        /* Heading */

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
        }


        /* Form */

        form {
            background: #181818;
            border: 1px solid #292929;
            border-radius: 12px;

            padding: 24px;

            display: flex;
            flex-direction: column;
            gap: 16px;

            margin-bottom: 35px;
        }


        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }


        label {
            font-size: 14px;
            color: #bdbdbd;
        }


        input {
            width: 100%;

            padding: 12px 14px;

            background: #101010;
            color: white;

            border: 1px solid #303030;
            border-radius: 8px;

            outline: none;

            font-size: 14px;
        }


        input:focus {
            border-color: #555;
        }


        input::placeholder {
            color: #666;
        }


        /* Add button */

        .submit-btn {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #f5f5f5;
            color: #111;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .submit-btn:hover {
            background: #dcdcdc;
        }


        /* Users container */

        #usersContainer {
            display: grid;

            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));

            gap: 18px;
        }


        /* User card */

        .user-card {
            position: relative;

            background: #181818;

            border: 1px solid #292929;

            border-radius: 12px;

            padding: 22px;

            min-height: 180px;

            transition: 0.2s;
        }


        .user-card:hover {
            border-color: #3a3a3a;
        }


        /* User information */

        .user-card h2 {
            font-size: 19px;

            margin-bottom: 14px;

            color: #ffffff;
        }


        .user-card p {
            font-size: 14px;

            color: #a5a5a5;

            margin: 8px 0;
        }


        /* Actions */

        .card-actions {
            display: flex;

            gap: 8px;

            margin-top: 20px;
        }


        .card-actions button {
            padding: 8px 12px;

            border-radius: 7px;

            border: 1px solid #333;

            background: #222;

            color: #ddd;

            cursor: pointer;

            font-size: 13px;

            transition: 0.2s;
        }


        .card-actions button:hover {
            background: #2d2d2d;
        }


        /* Delete button */

        .delete-btn {
            margin-left: auto;
        }
    </style>
</head>

<body>

    <main class="app">

        <h1>User Management</h1>

        <!-- Form -->
        <form id="userForm">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter email" required>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Enter age" required>
            </div>

            <button class="submit-btn" type="submit">
                Add User
            </button>

        </form>


        <!-- Users -->
        <section id="usersContainer"></section>

    </main>


    <script src="methods.js"></script>

</body>

</html>
