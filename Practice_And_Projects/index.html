<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphism Card</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
}

/* Glass Card */

.card{
    max-width:200px;
    padding:25px;
    text-align:center;

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);
    border-radius:20px;

    box-shadow:
        0 8px 32px rgba(0,0,0,.4),
        inset 0 1px 1px rgba(255,255,255,.2);

    transition:.3s ease;
}

.card:hover{
    transform:translateY(-8px) scale(1.03);
    box-shadow:
        0 15px 40px rgba(0,0,0,.55),
        0 0 20px rgba(59,130,246,.3);
}

.card img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    border:3px solid rgba(255,255,255,.2);
    margin-bottom:18px;
    overflow: hidden;
}

.card h2{
    color:#fff;
    margin-bottom:10px;
    font-size:15px;
}

.card p{
    color:#d1d5db;
    line-height:1.6;
    margin-bottom:20px;
}

#container{

    margin-bottom: 50px;
    width: 100%;
    height: 100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap: wrap;
    gap:30px;
    overflow-x: hidden;
}

input{
    margin-left: 200px;
    margin-bottom: 50px;
    position: relative;
    top: 20px;
    left: 200px;
    width: 300px;
    height: 40px;
    border-radius: 10px;
    border: none;
    outline: none;
    padding-left: 10px;
    font-size: 16px;
}

</style>

</head>
<body>


<div>
    <input type="text" placeholder="Filter card">
</div>

<div id="container">
    
</div>


<script src="FIlter_card_project.js"></script>

</body>
</html>
