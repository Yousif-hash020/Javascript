<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;  
        }
        input {
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            padding: 7px;
            display: block;
        }
        #main {
            margin : 20px;
            display: flex;
            flex-wrap: wrap;
            
        }

        form{
            padding: 50px;
            border: 1px solid white;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            width: 250px;
            margin: 20px;
        }
        .card{
            margin: 20px;
            width: 300px;
            padding: 10px;
            color: white;
            text-transform: capitalize;
            border: 1px solid #555;
            border-radius: 10px;
        }

        .Profile img{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }

        .Profile{
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            overflow: hidden;
        }
    </style>
</head>
<body style = "background-color: black; color: white;">

     <form action="">
            <input type="text" placeholder="Profile" >
            <input type="text" placeholder="Name">
            <input type="text" placeholder="Occupation">
            <input type="text" placeholder="Info">
            <input type="submit" placeholder="Submit" style="text-align: center;">
        </form>

    <div id="main">

    </div>
    <script src="Dynamic_form.js"></script>
</body>
</html>
