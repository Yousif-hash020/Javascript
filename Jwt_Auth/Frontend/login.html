<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #0d0d0d;
            color: white;
            font-family: Arial, sans-serif;
        }
        #loginform {
            padding: 30px;
            width: 260px;
            display: flex;
            flex-direction: column;
            background-color: rgb(29, 158, 115);
            border-radius: 10px;
        }
        input {
            padding: 10px;
            margin: 8px 0;
            border: none;
            border-radius: 5px;
        }
        button {
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background-color: #0d0d0d;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        #message {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="main">
        <form id="loginform">
            <h2>Login</h2>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div id="message"></div>
    </div>
    <script src="login.js"></script>
</body>
</html>
